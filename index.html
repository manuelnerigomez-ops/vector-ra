
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Vector 3D con Proyecciones</title>

  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.152.2/examples/js/controls/OrbitControls.js"></script>

  <style>
    body{
      margin:0;
      overflow:hidden;
      font-family: Arial, sans-serif;
      background:#f4f4f4;
    }

    #titulo{
      position:absolute;
      top:10px;
      left:10px;
      background:white;
      padding:10px;
      border-radius:10px;
      box-shadow:0 0 10px rgba(0,0,0,0.2);
      z-index:10;
    }
  </style>
</head>

<body>

<div id="titulo">
  <h2>Vector 3D</h2>
  <p>
    Vector desde el origen hasta (2,3,5)
  </p>
</div>

<script>

// ============================
// ESCENA
// ============================

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf4f4f4);

// ============================
// CÁMARA
// ============================

const camera = new THREE.PerspectiveCamera(
  45,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);

camera.position.set(10,10,10);

// ============================
// RENDERER
// ============================

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// ============================
// CONTROLES
// ============================

const controls = new THREE.OrbitControls(
  camera,
  renderer.domElement
);

// ============================
// ILUMINACIÓN
// ============================

const light = new THREE.DirectionalLight(0xffffff,1);
light.position.set(10,10,10);
scene.add(light);

scene.add(new THREE.AmbientLight(0xffffff,0.7));

// ============================
// EJES
// ============================

const axesHelper = new THREE.AxesHelper(8);
scene.add(axesHelper);

// ============================
// ESCALA EN LOS EJES
// ============================

function crearEtiqueta(texto, x, y, z){

  const canvas = document.createElement("canvas");
  const context = canvas.getContext("2d");

  canvas.width = 128;
  canvas.height = 64;

  context.fillStyle = "black";
  context.font = "28px Arial";
  context.fillText(texto,20,40);

  const texture = new THREE.CanvasTexture(canvas);

  const material = new THREE.SpriteMaterial({
    map:texture
  });

  const sprite = new THREE.Sprite(material);

  sprite.position.set(x,y,z);
  sprite.scale.set(1,0.5,1);

  scene.add(sprite);
}

// Escalas X
for(let i=0;i<=6;i++){
  crearEtiqueta(i,i,0,0);
}

// Escalas Y
for(let i=0;i<=6;i++){
  crearEtiqueta(i,0,i,0);
}

// Escalas Z
for(let i=0;i<=6;i++){
  crearEtiqueta(i,0,0,i);
}

// ============================
// VECTOR PRINCIPAL
// ============================

const origen = new THREE.Vector3(0,0,0);
const destino = new THREE.Vector3(2,3,5);

const direccion = new THREE.Vector3()
  .subVectors(destino, origen);

const flecha = new THREE.ArrowHelper(
  direccion.clone().normalize(),
  origen,
  direccion.length(),
  0xff0000,
  0.4,
  0.2
);

scene.add(flecha);

// ============================
// PUNTO FINAL
// ============================

const esfera = new THREE.Mesh(
  new THREE.SphereGeometry(0.12,32,32),
  new THREE.MeshBasicMaterial({color:0xff0000})
);

esfera.position.set(2,3,5);
scene.add(esfera);

// ============================
// PROYECCIONES
// ============================

// ---------- PLANO XY ----------

const puntosXY = [
  new THREE.Vector3(0,0,0),
  new THREE.Vector3(2,0,0),
  new THREE.Vector3(2,3,0),
  new THREE.Vector3(0,3,0),
  new THREE.Vector3(0,0,0)
];

crearLinea(puntosXY,0x0000ff);

// ---------- PLANO XZ ----------

const puntosXZ = [
  new THREE.Vector3(0,0,0),
  new THREE.Vector3(2,0,0),
  new THREE.Vector3(2,0,5),
  new THREE.Vector3(0,0,5),
  new THREE.Vector3(0,0,0)
];

crearLinea(puntosXZ,0x00aa00);

// ---------- PLANO YZ ----------

const puntosYZ = [
  new THREE.Vector3(0,0,0),
  new THREE.Vector3(0,3,0),
  new THREE.Vector3(0,3,5),
  new THREE.Vector3(0,0,5),
  new THREE.Vector3(0,0,0)
];

crearLinea(puntosYZ,0xff00ff);

// ============================
// FUNCIÓN PARA LÍNEAS
// ============================

function crearLinea(puntos,color){

  const geometry = new THREE.BufferGeometry()
    .setFromPoints(puntos);

  const material = new THREE.LineBasicMaterial({
    color:color
  });

  const linea = new THREE.Line(
    geometry,
    material
  );

  scene.add(linea);
}

// ============================
// LÍNEAS DE PROYECCIÓN
// ============================

crearLinea([
  new THREE.Vector3(2,3,5),
  new THREE.Vector3(2,3,0)
],0x555555);

crearLinea([
  new THREE.Vector3(2,3,5),
  new THREE.Vector3(2,0,5)
],0x555555);

crearLinea([
  new THREE.Vector3(2,3,5),
  new THREE.Vector3(0,3,5)
],0x555555);

// ============================
// ANIMACIÓN
// ============================

function animate(){

  requestAnimationFrame(animate);

  controls.update();

  renderer.render(scene,camera);
}

animate();

// ============================
// RESPONSIVE
// ============================

window.addEventListener("resize",()=>{

  camera.aspect = window.innerWidth/window.innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );

});

</script>

</body>
</html>
