
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>RA Vector 3D</title>

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

<style>
body{
    margin:0;
    overflow:hidden;
    font-family:Arial;
}
#info{
    position:absolute;
    top:10px;
    left:10px;
    background:white;
    padding:10px;
    border-radius:10px;
    z-index:999;
}
</style>

</head>

<body>

<div id="info">
<h3>Vector Fuerza 3D</h3>
<p>Escanea el marcador HIRO</p>
</div>

<a-scene
embedded
arjs="sourceType: webcam; debugUIEnabled: false;">

<!-- MARCADOR -->
<a-marker preset="hiro">

    <!-- EJES -->

    <!-- X -->
    <a-cylinder
        position="2 0 0"
        rotation="0 0 90"
        radius="0.02"
        height="8"
        color="red">
    </a-cylinder>

    <!-- Y -->
    <a-cylinder
        position="0 2 0"
        radius="0.02"
        height="8"
        color="green">
    </a-cylinder>

    <!-- Z -->
    <a-cylinder
        position="0 0 2"
        rotation="90 0 0"
        radius="0.02"
        height="8"
        color="blue">
    </a-cylinder>

    <!-- MARCAS ESCALA X -->
    <a-text value="1" position="1 0 0" scale="1 1 1" color="red"></a-text>
    <a-text value="2" position="2 0 0" scale="1 1 1" color="red"></a-text>

    <!-- MARCAS ESCALA Y -->
    <a-text value="1" position="0 1 0" scale="1 1 1" color="green"></a-text>
    <a-text value="2" position="0 2 0" scale="1 1 1" color="green"></a-text>
    <a-text value="3" position="0 3 0" scale="1 1 1" color="green"></a-text>

    <!-- MARCAS ESCALA Z -->
    <a-text value="1" position="0 0 1" scale="1 1 1" color="blue"></a-text>
    <a-text value="5" position="0 0 5" scale="1 1 1" color="blue"></a-text>

    <!-- VECTOR PRINCIPAL -->

    <a-cylinder
        position="2 3 5"
        radius="0.05"
        height="6.3"
        color="#ff6600"
        rotation="71.1 60.9 35.8">
    </a-cylinder>

    <!-- PUNTA -->
    <a-cone
        position="2 3 5"
        radius-bottom="0.18"
        radius-top="0"
        height="0.4"
        color="#ff3300"
        rotation="71.1 60.9 35.8">
    </a-cone>

    <!-- PUNTO FINAL -->
    <a-sphere
        position="2 3 5"
        radius="0.12"
        color="yellow">
    </a-sphere>

    <!-- PARALELOGRAMO XY -->

    <a-plane
        position="1 1.5 0"
        width="2"
        height="3"
        color="#0000ff"
        opacity="0.25">
    </a-plane>

    <!-- PARALELOGRAMO XZ -->

    <a-plane
        position="1 0 2.5"
        rotation="-90 0 0"
        width="2"
        height="5"
        color="#00aa00"
        opacity="0.25">
    </a-plane>

    <!-- PARALELOGRAMO YZ -->

    <a-plane
        position="0 1.5 2.5"
        rotation="0 90 0"
        width="5"
        height="3"
        color="#ff00ff"
        opacity="0.25">
    </a-plane>

    <!-- ETIQUETA -->

    <a-text
        value="F(2,3,5)"
        position="2.3 3 5"
        scale="1.5 1.5 1.5"
        color="black">
    </a-text>

</a-marker>

<!-- CAMARA -->
<a-entity camera></a-entity>

</a-scene>

</body>
</html>
</html>
