
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Vector Fuerza 3D - Realidad Aumentada</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin:0; overflow:hidden;">
  <a-scene embedded arjs="sourceType: webcam;">

    <a-marker preset="hiro">

      <!-- Ejes -->
      <a-cylinder position="0 0 0" rotation="0 0 90" radius="0.02" height="2" color="red"></a-cylinder>
      <a-cylinder position="0 0 0" radius="0.02" height="2" color="green"></a-cylinder>
      <a-cylinder position="0 0 0" rotation="90 0 0" radius="0.02" height="2" color="blue"></a-cylinder>

      <!-- Vector fuerza -->
      <a-cylinder position="1 1 1" rotation="0 0 -45" radius="0.04" height="1.5" color="#FFA500"></a-cylinder>
      <a-cone position="1 1 0" rotation="0 0 -45" radius-bottom="0.12" radius-top="0" height="0.3" color="#FF6600"></a-cone>

      <!-- Texto -->
      <a-text value="Vector Fuerza F" position="0 1.5 0" scale="1 1 1" color="black"></a-text>
      <a-text value="Direccion, sentido y magnitud" position="-1 1.2 0" scale="0.7 0.7 0.7" color="black"></a-text>

    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
